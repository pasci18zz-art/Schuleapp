name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signierschlüssel aus den Repository-Secrets, damit jede APK als Update installiert werden kann.
      - name: Signierschlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signiere mit dem festen Schlüssel aus den Secrets."
          else
            echo "::warning::Keine Signier-Secrets gesetzt – APK wird mit einem Debug-Schlüssel signiert und lässt sich evtl. nicht über ältere Versionen installieren."
          fi

      # Ohne Secrets: Debug-Schlüssel zwischenspeichern, damit er zwischen Builds gleich bleibt.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Schulplaner-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Schulplaner-${{ github.run_number }}
          path: Schulplaner-${{ github.run_number }}.apk

      - name: Als "Neueste Version" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub antwortet manchmal mit Serverfehlern – dann bis zu 4-mal neu versuchen.
          for i in 1 2 3 4; do
            gh release delete neueste-version -y --cleanup-tag || true
            if gh release create neueste-version Schulplaner-${{ github.run_number }}.apk \
              --title "Schulplaner – neueste Version (Build ${{ github.run_number }})" \
              --notes "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }}. Auf dem Handy die APK herunterladen und installieren." \
              --prerelease \
              --target ${{ github.sha }}; then
              exit 0
            fi
            echo "Versuch $i fehlgeschlagen, warte kurz …"
            sleep $((i * 10))
          done
          exit 1
