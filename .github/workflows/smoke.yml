name: Starttest im Emulator

# Läuft, wenn die Commit-Nachricht "[test]" enthält: baut die vorige und die neue Version
# und startet beide im Emulator, um Abstürze beim Start/Update zu finden.
on:
  push:

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Handy und Tablet (das Tablet nutzt die breite Heute-Ansicht).
        profile: [pixel_6, pixel_c]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Alte Version bauen (Build 13)
        run: |
          git worktree add "$RUNNER_TEMP/old" 67f71c63628050a90867842588920b58e5839dab
          cd "$RUNNER_TEMP/old" && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/old.apk"

      - name: Neue Version bauen
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/new.apk"

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash ci/smoke.sh "$RUNNER_TEMP/old.apk" "$RUNNER_TEMP/new.apk"
