name: Screenshots im Emulator

# Läuft, wenn die Commit-Nachricht "[shots]" enthält: startet die App im Emulator, bedient sie
# (Startseite anpassen, Stimmung) und legt Screenshots auf den Branch ci-shots-<profil>.
on:
  push:

jobs:
  shots:
    if: contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_6, pixel_c]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app.apk"

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator bedienen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash ci/shots.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/shots"

      - name: Screenshots ablegen
        if: always()
        run: |
          cd "$RUNNER_TEMP/shots" || exit 0
          git init -q
          git checkout -q -b shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin shots:refs/heads/ci-shots-${{ matrix.profile }}
